name: Build Assist APK

on:
  push:
    branches:
      - assist-v1
      - assist-0.1-fix1
      - assist-0.1-fix2
      - assist-0.2-extra-challenge
      - assist-0.2-fix1
      - assist-0.3-infinite-world
      - assist-0.3.1-worldgen
      - assist-0.3.2-worldfix
      - assist-0.3.3-worldfix2
      - assist-0.3.4-streamfix
      - assist-0.3.5-texturefix
      - assist-0.3.6-renderfix
      - assist-0.3.7-worldstate
      - assist-0.3.8-worldcontent
      - assist-0.3.9-density
      - assist-0.4.0-worldloot
      - assist-0.4.1-themedrooms
      - assist-0.4.2-secrets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Sign with stable Assist test certificate
        shell: bash
        run: |
          set -euo pipefail
          AOSP_BUILD_SHA=045a3d6a3e359633a14853a5a5e1e4f2a11cbdae
          curl -L --fail -o /tmp/assist-testkey.pk8 \
            "https://raw.githubusercontent.com/aosp-mirror/platform_build/$AOSP_BUILD_SHA/target/product/security/testkey.pk8"
          curl -L --fail -o /tmp/assist-testkey.x509.pem \
            "https://raw.githubusercontent.com/aosp-mirror/platform_build/$AOSP_BUILD_SHA/target/product/security/testkey.x509.pem"

          UNSIGNED="$(find android/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f -v 4 \
            "$UNSIGNED" /tmp/ShatteredPD-Assist-aligned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --key /tmp/assist-testkey.pk8 \
            --cert /tmp/assist-testkey.x509.pem \
            --out android/build/outputs/apk/release/ShatteredPD-Assist-base.apk \
            /tmp/ShatteredPD-Assist-aligned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs \
            android/build/outputs/apk/release/ShatteredPD-Assist-base.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Assist-Base
          path: android/build/outputs/apk/release/ShatteredPD-Assist-base.apk
          if-no-files-found: error
